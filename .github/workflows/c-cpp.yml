name: C/C++ CI

on:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-24.04
    container: devkitpro/devkitarm

    steps:
      - uses: actions/checkout@v4
      - name: make
        run: make all
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ダウンロード
          path: |
            N3DS_QTM_Disabled_HomeBrewApplication.3dsx
            compression-level: 0
            
